name: Synthetic performance audit (no release)
on:
  push:
    branches: [codex/performance-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-performance:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install matching application dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Record the benchmark environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force perf-results | Out-Null
          $cpu = Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
          $system = Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory
          @{ cpu = $cpu; system = $system; source = (git rev-parse HEAD); product = '2.4.0'; synthetic = $true } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 perf-results/environment.json
      - name: Download and verify the published Windows executable
        shell: pwsh
        run: |
          $base = 'https://github.com/ovplotnikov/patient-study-importer/releases/download/v2.4.0/'
          $archive = Join-Path $env:RUNNER_TEMP 'PatientStudyImporter-Windows.zip'
          $checksumPath = Join-Path $env:RUNNER_TEMP 'PatientStudyImporter-Windows.sha256'
          Invoke-WebRequest ($base + 'PatientStudyImporter-Windows.sha256') -OutFile $checksumPath
          $checksum = (Get-Content $checksumPath -Raw).Trim().Split(' ')[0]
          Invoke-WebRequest ($base + 'PatientStudyImporter-Windows.zip') -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $checksum) { throw 'Release checksum mismatch' }
          $target = Join-Path $env:RUNNER_TEMP 'published-2.4.0'
          Expand-Archive $archive -DestinationPath $target
          "PUBLISHED_EXE=$target/Исследования пациентов.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Measure published startup and duplicate runtime libraries
        run: python benchmarks/performance/startup.py --exe "$env:PUBLISHED_EXE" --source app.py --repeat 5 --output perf-results/startup.json
      - name: Measure real synthetic imports
        run: python benchmarks/performance/e2e.py --counts 10 100 500 --output perf-results/e2e.json
      - name: Compare safe storage prototypes and verify complete XLSX parity
        run: python benchmarks/performance/storage.py --counts 100 1000 --repeats 3 --output perf-results/storage.json
      - name: Measure storage optimizations separately
        run: python benchmarks/performance/storage.py --counts 1000 --variants current index catalog styles --repeats 1 --output perf-results/storage-components.json
      - name: Measure interface database reads
        run: python benchmarks/performance/ui_reads.py --counts 100 1000 5000 --repeat 3 --output perf-results/ui-reads.jsonl
      - name: Measure native Tk queue callbacks
        run: python benchmarks/performance/tk_queue.py --counts 10 100 1000 --repeat 3 --output perf-results/tk-queue.json
      - name: Compare parsing and patient lookup prototypes
        run: python benchmarks/performance/analysis.py --rows 20 100 500 --patients 100 1000 3000 --repeats 7 --output perf-results/analysis.json
      - name: Install matching Tesseract runtime for source OCR measurements
        run: choco install tesseract --version 5.5.3.20260724 --yes --no-progress
      - name: Prepare pinned OCR weights
        run: python -c "import sys; sys.path.insert(0,'packaging'); from pathlib import Path; from ocr_models import prepare_models; prepare_models(Path('vendor'))"
      - name: Compare unchanged dual OCR output and performance
        run: python benchmarks/performance/ocr.py --vendor vendor --tesseract 'C:/Program Files/Tesseract-OCR/tesseract.exe' --repeats 2 --output perf-results/ocr.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-performance-results
          path: |
            perf-results/*.json
            perf-results/*.jsonl
          retention-days: 14
