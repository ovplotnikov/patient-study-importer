name: Build and verify Windows application
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/PUBLICATION_AUDIT.md']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import patient_importer; print(patient_importer.__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and program version differ" }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3 reportlab==5.1.0
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Install OCR on the build machine
        run: choco install tesseract --version 5.5.3.20260724 --yes --no-progress
      - name: Capture new interface with synthetic documents
        run: python app.py --ui-smoke-test "${{ runner.temp }}/patient-ui-source"
      - name: Build versioned offline visual guide
        run: python packaging/build_guide.py "${{ runner.temp }}/patient-ui-source" build/guide
      - name: Build standalone executable
        run: python packaging/build_windows.py
      - name: Test packaged executable and OCR
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $testRoot = Join-Path $env:RUNNER_TEMP 'patient-app-test'
          Rename-Item 'C:\Program Files\Tesseract-OCR' 'Tesseract-OCR-build-only'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test', $testRoot -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'Packaged self-test timed out' }
          if ($p.ExitCode -ne 0) { throw "Packaged self-test failed with exit $($p.ExitCode)" }
          $result = Get-Content (Join-Path $testRoot 'self-test.json') | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged self-test did not pass' }
          Copy-Item (Join-Path $testRoot 'self-test.json') dist/self-test.json
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--ui-smoke-test', $testRoot -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Packaged GUI timed out' }
          if ($p.ExitCode -ne 0) { throw "Packaged GUI failed with exit $($p.ExitCode)" }
          Copy-Item (Join-Path $testRoot 'ui-test.json') dist/ui-test.json
          New-Item -ItemType Directory -Force dist/screenshots | Out-Null
          Copy-Item (Join-Path $testRoot '*.png') dist/screenshots/
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - name: Test frozen automatic updater and data preservation
        run: python packaging/test_windows_update.py
      - name: Prepare verified performance baseline
        if: github.event_name != 'push'
        shell: pwsh
        run: |
          git fetch --depth=1 origin tag v2.4.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch performance baseline' }
          $baselineCommit = git rev-parse 'v2.4.0^{commit}'
          if ($baselineCommit -ne 'f17e5f46f32c9dbaa7aae98fb40e5f6c19c4ed7d') { throw 'Unexpected baseline source commit' }
          $baselineZip = Join-Path $env:RUNNER_TEMP 'baseline-source.zip'
          git archive --format=zip --output=$baselineZip v2.4.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot archive performance baseline' }
          python -m zipfile -e $baselineZip "$env:RUNNER_TEMP/baseline-240"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract baseline source' }
          $releaseZip = Join-Path $env:RUNNER_TEMP 'baseline-release.zip'
          Invoke-WebRequest 'https://github.com/ovplotnikov/patient-study-importer/releases/download/v2.4.0/PatientStudyImporter-Windows.zip' -OutFile $releaseZip
          if ((Get-FileHash $releaseZip -Algorithm SHA256).Hash.ToLower() -ne '3b65c1ae834c7a4f0fe6dc90d47f79bd8602c5f4e3d45bfb49f2e564584fc93f') { throw 'Baseline release checksum mismatch' }
          python -m zipfile -e $releaseZip "$env:RUNNER_TEMP/baseline-release"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract baseline release' }
      - name: Compare production paths on synthetic documents
        if: github.event_name != 'push'
        shell: pwsh
        run: |
          python packaging/compare_app_performance.py --baseline "$env:RUNNER_TEMP/baseline-240" --output performance-results/application.json
          if ($LASTEXITCODE -ne 0) { throw 'Application performance comparison failed' }
          python packaging/compare_registry_performance.py --baseline "$env:RUNNER_TEMP/baseline-240" --output performance-results/registry.json
          if ($LASTEXITCODE -ne 0) { throw 'Registry performance comparison failed' }
          python packaging/compare_diagnostics_performance.py --baseline "$env:RUNNER_TEMP/baseline-240" --output performance-results/diagnostics.json
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic aggregation comparison failed' }
          python packaging/compare_ocr_performance.py --baseline "$env:RUNNER_TEMP/baseline-240" --vendor vendor --tesseract vendor/tesseract/tesseract.exe --output performance-results/ocr.json
          if ($LASTEXITCODE -ne 0) { throw 'OCR performance comparison failed' }
          python packaging/compare_ui_performance.py --baseline "$env:RUNNER_TEMP/baseline-240" --output performance-results/interface.json
          if ($LASTEXITCODE -ne 0) { throw 'Interface performance comparison failed' }
          $baselineExe = Get-ChildItem "$env:RUNNER_TEMP/baseline-release" -Filter *.exe -Recurse | Select-Object -First 1
          $candidateExe = Get-ChildItem dist/*.exe | Select-Object -First 1
          python packaging/compare_frozen_performance.py --baseline-exe $baselineExe.FullName --candidate-exe $candidateExe.FullName --output performance-results/startup.json
          if ($LASTEXITCODE -ne 0) { throw 'Frozen startup comparison failed' }
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push'
        with:
          name: performance-results
          path: performance-results/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: interface-and-guide
          path: |
            dist/screenshots/
            dist/docs/
            dist/*test.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: patient-study-importer-windows
          path: dist/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-diagnostics
          path: |
            ${{ runner.temp }}/patient-app-test/
            ${{ runner.temp }}/patient-ui-source/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patient-study-importer-windows
          path: dist
      - name: Package release archive
        run: python3 packaging/package_release.py dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PatientStudyImporter-Windows.zip dist/PatientStudyImporter-Windows.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Исследования пациентов $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md --verify-tag
