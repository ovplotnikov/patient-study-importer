name: Synthetic diagnostics performance (no network reports)
on:
  push:
    branches: [codex/performance-audit]
    paths:
      - .github/workflows/performance-diagnostics.yml
      - benchmarks/performance/diagnostics.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics-performance:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the local state lock dependency
        run: python -m pip install portalocker==3.2.0
      - name: Measure synthetic diagnostics with network disabled
        run: python benchmarks/performance/diagnostics.py --counts 100 1000 --repeats 3 --output perf-results/diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-diagnostics-performance
          path: perf-results/diagnostics.json
          retention-days: 14
